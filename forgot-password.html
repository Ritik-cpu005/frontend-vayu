<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Vayu Brahman</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="js/auth.js" defer></script>
</head>
<body>
    <main class="auth-shell">
        <section class="auth-intro">
            <a class="wordmark" href="index.html">VAYU <span>BRAHMAN</span></a>
            <p class="eyebrow">Account access</p>
            <h1>Find your way<br><em>back in.</em></h1>
            <p>Confirm your email address, then choose a new password for your account.</p>
        </section>
        <section class="auth-form">
            <h2>Reset password</h2>
            <form onsubmit="return requestPasswordCode();">
                <div class="input-group"><label for="reset-email">Account email</label><input id="reset-email" type="email" required placeholder="Enter your email"></div>
                <button type="submit" class="button">Send confirmation code</button>
            </form>
            <form id="reset-confirmation" hidden onsubmit="return confirmPasswordReset();">
                <div class="input-group"><label for="reset-code">Email confirmation code</label><input id="reset-code" inputmode="numeric" required placeholder="6-digit code"></div>
                <div class="input-group"><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" required placeholder="At least 8 characters"></div>
                <button type="submit" class="button">Update password</button>
            </form>
            <p id="reset-status" class="auth-links" role="status"></p>
            <p class="auth-links"><a href="login.html">Back to login</a></p>
        </section>
    </main>
</body>
</html>
