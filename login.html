<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vayu Brahman | Login</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/auth.js" defer></script>
</head>
<body>
    <main class="auth-shell">
        <section class="auth-intro">
            <a class="wordmark" href="index.html">VAYU <span>BRAHMAN</span></a>
            <p class="eyebrow">Welcome back</p>
            <h1>Your journey,<br><em>your way.</em></h1>
            <p>Sign in to keep your trips, profile, and travel plans together.</p>
        </section>
        <section class="auth-form">
        <h2>Log in</h2>
        <form onsubmit="return validateForm();">
            <div class="input-group">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Enter your username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter password">
            </div>

            

            <button type="submit" class="button">Login</button>
        </form>
        <div class="auth-links"><a href="forgot-password.html">Forgot password?</a><br>New here? <a href="newuser.html">Create an account</a><br><a href="customer-care.html">Contact customer care</a></div>
        </section>
    </main>
</body>
</html>
