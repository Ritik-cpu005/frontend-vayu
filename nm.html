<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vayu Brahman | Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e6f4ff 0%, #d9f5d2 100%);
            color: #1c2b3a;
        }

        .signup-card {
            width: 100%;
            max-width: 430px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(13, 60, 97, 0.15);
            backdrop-filter: blur(5px);
        }

        .brand {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.1rem;
            letter-spacing: 2px;
            color: #0d3b66;
        }

        .tagline {
            text-align: center;
            margin: 0 0 25px;
            font-size: 1.1rem;
            color: #45627f;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 8px;
            font-size: 0.92rem;
            color: #2c4560;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 10px;
            border: 1px solid #c5d5e6;
            background: #f9fbff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.12);
        }

        .btn {
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0d3b66, #3d8fd6);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(13, 59, 102, 0.2);
        }

        .login-link {
            margin-top: 18px;
            text-align: center;
            color: #48647e;
            font-size: 0.95rem;
        }

        .login-link a {
            color: #0d3b66;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <h1 class="brand">VAYU BRAHMAN</h1>
        <h2 class="tagline">Start Your Journey Here</h2>

        <form>
             class="input-group">
                <label for="fullname">Full Name</label>
                <input id="fullname" type="text" placeholder="Enter your full name">
            

            <div class="input-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Choose a username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Create a password">
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password" type="password" placeholder="Re-enter password">
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>
</body>
</html>
